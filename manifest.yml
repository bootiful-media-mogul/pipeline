---
# every mogul app on cloud foundry, pushed as the same container images GKE runs. see README.md.
# ((name)) comes from a vars file: vars/<foundation>.yml for names and hosts, and the secrets
# bin/deploy.sh writes to a temporary one. nothing secret belongs in this file.
applications:

  - name: gateway
    docker:
      image: ((registry))/gateway@((gateway-digest))
      username: _json_key
    instances: 1
    memory: 2G
    disk_quota: 10G
    routes:
      - route: ((gateway-host)).((domain))
    health-check-type: http
    health-check-http-endpoint: /actuator/health/readiness
    timeout: 180
    env: &env
      LANG: en_US.UTF-8
      TZ: UTC
      SERVER_PORT: "8080"
      MOGUL_SERVICE_HOST: ((MOGUL_SERVICE_HOST))
      MOGUL_GATEWAY_HOST: ((MOGUL_GATEWAY_HOST))
      MOGUL_CLIENT_HOST: ((MOGUL_CLIENT_HOST))
      MOGUL_MANAGED_FILES_S3_BUCKET: ((MOGUL_MANAGED_FILES_S3_BUCKET))
      MOGUL_AWS_CLOUDFRONT_DOMAIN: ((MOGUL_AWS_CLOUDFRONT_DOMAIN))
      AWS_REGION: ((AWS_REGION))
      ABLY_KEY: ((ABLY_KEY))
      AUTH0_CLIENT_ID: ((AUTH0_CLIENT_ID))
      AUTH0_CLIENT_SECRET: ((AUTH0_CLIENT_SECRET))
      AUTH0_DOMAIN: ((AUTH0_DOMAIN))
      AWS_ACCESS_KEY_ID: ((AWS_ACCESS_KEY_ID))
      AWS_ACCESS_KEY_SECRET: ((AWS_ACCESS_KEY_SECRET))
      DB_HOST: ((DB_HOST))
      DB_PASSWORD: ((DB_PASSWORD))
      DB_SCHEMA: ((DB_SCHEMA))
      DB_USERNAME: ((DB_USERNAME))
      ELASTICSEARCH_API_HOST: ((ELASTICSEARCH_API_HOST))
      ELASTICSEARCH_API_KEY: ((ELASTICSEARCH_API_KEY))
      ELASTICSEARCH_OTEL_HEADER: ((ELASTICSEARCH_OTEL_HEADER))
      ELASTICSEARCH_OTEL_HOST: ((ELASTICSEARCH_OTEL_HOST))
      OPENAI_KEY: ((OPENAI_KEY))
      REDIS_HOST: ((REDIS_HOST))
      REDIS_PASSWORD: ((REDIS_PASSWORD))
      REDIS_PORT: ((REDIS_PORT))
      RMQ_HOST: ((RMQ_HOST))
      RMQ_PASSWORD: ((RMQ_PASSWORD))
      RMQ_USERNAME: ((RMQ_USERNAME))
      RMQ_VIRTUAL_HOST: ((RMQ_VIRTUAL_HOST))
      SETTINGS_PASSWORD: ((SETTINGS_PASSWORD))
      SETTINGS_SALT: ((SETTINGS_SALT))
      WP_CLIENT_ID: ((WP_CLIENT_ID))
      WP_CLIENT_SECRET: ((WP_CLIENT_SECRET))

  # the vue spa, served by nginx (a paketo image built by the client's own workflow). the only
  # thing it reads is where the api is, which nginx hands the spa as /config.js; none of the
  # secrets.
  - name: client
    docker:
      image: ((registry))/client@((client-digest))
      username: _json_key
    instances: 1
    memory: 256M
    disk_quota: 1G
    routes:
      - route: ((client-host)).((domain))
    health-check-type: http
    health-check-http-endpoint: /
    env:
      MOGUL_SERVICE_HOST: ((MOGUL_SERVICE_HOST))

  - name: api
    docker:
      image: ((registry))/api@((api-digest))
      username: _json_key
    instances: 1
    memory: 3G
    disk_quota: 10G
    routes:
      - route: ((api-host)).((domain))
    health-check-type: http
    health-check-http-endpoint: /actuator/health/readiness
    timeout: 180
    env:
      <<: *env
      # mogul.feeds.namespace, the xml namespace of mogul's own elements in the feeds
      MOGUL_FEEDS_NAMESPACE: ((MOGUL_FEEDS_NAMESPACE))

  # the headless worker: no route, and so no http health check. the process being alive is
  # the right signal for it, as on GKE. the cell's graceful shutdown interval
  # (CF_GRACEFUL_SHUTDOWN_SECONDS in cf/.env) gives JobRunr its four minutes on a stop.
  - name: processors
    docker:
      image: ((registry))/processors@((processors-digest))
      username: _json_key
    instances: 1
    memory: 4G
    disk_quota: 10G
    no-route: true
    health-check-type: process
    timeout: 180
    env: *env
