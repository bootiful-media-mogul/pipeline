#@ load("@ytt:data", "data")

apiVersion: apps/v1
kind: Deployment
metadata:
  name: #@ str(data.values.service) + '-deployment'
spec:
  #@ if not data.values.scaling.enabled:
  replicas: #@ data.values.replicas
  #@ end
  selector:
    matchLabels:
      app: #@ str(data.values.service)
  template:
    metadata:
      labels:
        app: #@ str(data.values.service)
    spec:
      shareProcessNamespace: true

      #! a pod picked for scale-down is not necessarily an idle one, so give JobRunr room
      #! to finish what it is holding. anything that outlives this is not lost: the job
      #! stops being heartbeated, another node declares it orphaned after
      #! poll-interval x server-timeout-poll-interval-multiplicand, and it is retried.
      terminationGracePeriodSeconds: #@ data.values.terminationGracePeriodSeconds

      containers:
        - name: #@ data.values.service  + '-container'


          image: #@ data.values.container
          imagePullPolicy: Always

          #! the probes are all httpGet against the actuator, so they only apply to an
          #! exposed app. a headless worker has no endpoint to probe: kubernetes falls
          #! back to the process being alive, which is the correct signal for it anyway.
          #@ if data.values.expose:

          #@ if data.values.probes.livenessProbe :
          livenessProbe: #@ data.values.probes.livenessProbe
          #@ end

          #@ if data.values.probes.readinessProbe :
          readinessProbe: #@ data.values.probes.readinessProbe
          #@ end

          #@ end

          resources:
            limits:
              
              #@ if data.values.resources.limits['ephemeral-storage'] :
              ephemeral-storage: #@  data.values.resources.limits['ephemeral-storage']
              #@ end
              
              #@ if data.values.resources.limits.cpu:
              cpu : #@ data.values.resources.limits.cpu
              #@ end

              #@ if data.values.resources.limits.memory:
              memory: #@ data.values.resources.limits.memory
              #@ end
            requests:
              
              #@ if data.values.resources.requests['ephemeral-storage'] :
              ephemeral-storage: #@ data.values.resources.requests['ephemeral-storage']
              #@ end
              
              
              #@ if data.values.resources.requests.cpu:
              cpu : #@ data.values.resources.requests.cpu
              #@ end

              #@ if data.values.resources.requests.memory:
              memory: #@ data.values.resources.requests.memory
              #@ end

          #@ if data.values.expose:
          ports:
            - containerPort:  #@ data.values.port
          #@ end
          envFrom:
            - secretRef:
                name: mogul-secrets
          env:
            #@ if data.values.expose:
            - name: SERVER_PORT
              value:  #@ str(data.values.port)
            #@ end
            - name: LANG
              value: "en_US.UTF-8"
            - name: TZ
              value: "UTC"


#@ if data.values.expose:
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: #@ data.values.service  + '-certificate'
spec:
  domains:
    -  #@ str(data.values.url)


---



apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: #@ data.values.service  + '-backend-config'
spec:
  timeoutSec: 120


---
apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/backend-config: #@ '{ "default" : "' + data.values.service  + '-backend-config"}'
  name: #@ data.values.service  + '-service'
spec:
  type: NodePort
  selector:
    app: #@ data.values.service
  ports:
    - port:  #@ data.values.port
      targetPort:  #@ data.values.port

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: #@ data.values.service  + '-ingress'
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    ingress.kubernetes.io/force-ssl-redirect: "true"

    kubernetes.io/ingress.global-static-ip-name: #@  'mogul-' + data.values.service +'-ip'
    networking.gke.io/managed-certificates: #@  data.values.service +'-certificate'

spec:

  rules:
    - host: #@ data.values.url
      http:
        paths:
          - pathType: ImplementationSpecific
            path: "/*"
            backend:
              service:
                name:  #@ data.values.service + '-service'
                port:
                  number:  #@ data.values.port
#@ end


#@ if data.values.scaling.enabled:
---
#! the database this reads is the one the app itself is given, so the credentials are the
#! ones already in mogul-secrets. note that KEDA's operator connects from its own
#! namespace: DB_HOST has to be reachable from there too, not only from this pod.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: #@ data.values.service + '-jobrunr-trigger-auth'
spec:
  secretTargetRef:
    - parameter: host
      name: mogul-secrets
      key: DB_HOST
    - parameter: dbName
      name: mogul-secrets
      key: DB_SCHEMA
    - parameter: userName
      name: mogul-secrets
      key: DB_USERNAME
    - parameter: password
      name: mogul-secrets
      key: DB_PASSWORD

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: #@ data.values.service + '-scaled-object'
spec:
  scaleTargetRef:
    name: #@ data.values.service + '-deployment'
  minReplicaCount: #@ data.values.scaling.minReplicas
  maxReplicaCount: #@ data.values.scaling.maxReplicas
  #! the query is a count of two indexed columns; every 30s is nothing.
  pollingInterval: 30
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          #! media jobs run for minutes and a render thrown away is a render paid for
          #! twice, so come down slowly: one pod at a time, and only once the work has
          #! stayed gone for ten minutes.
          stabilizationWindowSeconds: 600
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300
  triggers:
    - type: postgresql
      authenticationRef:
        name: #@ data.values.service + '-jobrunr-trigger-auth'
      metadata:
        port: "5432"
        sslmode: prefer
        targetQueryValue: #@ str(data.values.scaling.workPerReplica)
        #! the whole query is a deployment name against a view. the view already answers 0
        #! for an idle module (api's V47), so there is nothing defensive to do here.
        query: #@ "select depth from jobrunr_jobs_by_module where module = '" + data.values.service + "'"
#@ end
